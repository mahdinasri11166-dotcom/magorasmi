name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: assembleRelease + sign
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages (API 34 + NDK + CMake)
        run: |
          set +e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"
          exit 0

      - name: Decode release keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret KEYSTORE_BASE64 is missing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > mishkat-release.jks
          test -s mishkat-release.jks
          ls -la mishkat-release.jks

      # 👇 این بخشی است که باعث رفع خطای شما می‌شود 👇
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # 👆 ------------------------------------------------- 👆

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/mishkat-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: Secret KEYSTORE_PASSWORD is required."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            export KEY_PASSWORD="$KEYSTORE_PASSWORD"
          fi
          if [ -z "$KEY_ALIAS" ]; then
            export KEY_ALIAS=mrelf
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK exists and is signed
        run: |
          ls -la app/build/outputs/apk/release/ || true
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          test -n "$APK"
          echo "APK=$APK"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK" || true
          fi
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$APK" || true

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Mishkat-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup keystore from runner
        if: always()
        run: rm -f mishkat-release.jks
